# gitleaks configuration for the CI secret scan (secrets job in
# .github/workflows/check.yml), ported from put.gd-desktop. The default rules
# apply; the allowlists below name the values these records legitimately contain
# that look like secrets. Digest/UUID exceptions require both a false-positive
# rule ID and a verified path. Fixture exceptions match the extracted secret
# exactly, never adjacent text.
title = "put.gd evidence secret scan"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Package receipts, evidence checksums/build IDs and source inventories.
# Neither Sourcegraph nor Squarespace credentials are exempted by this list.
[[allowlists]]
description = "Recorded digests and public signing fingerprints"
targetRules = ["generic-api-key", "sentry-access-token"]
condition = "AND"
paths = ['''^records/''']
regexTarget = "secret"
regexes = ['''^(?:[0-9a-fA-F]{40}|[0-9a-fA-F]{64})$''']

[[allowlists]]
description = "UUID-named object keys in publication receipts and storage visual evidence"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^records/[^/]+/(?:.*/)?receipt[^/]*\.json$''',
         '''^records/[^/]+/(?:.*/)?receipts/(?:.*/)?[^/]+\.json$''',
         '''^records/2026-10-14-storage-tray-native/(?:cinnamon|gnome|kde)/visual-results\.json$''',
         '''^records/2026-10-14-storage-tray-native/kde-fresh/visual\.json$''']
regexTarget = "secret"
regexes = ['''^[A-Za-z0-9._-]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[A-Za-z0-9._-]*$''']

[[allowlists]]
description = "Public verification keys, CMake cache entries and error-code names"
regexTarget = "secret"
regexes = [
  '''^RW[A-Za-z0-9+/=]{50,60}$''',
  '''^INTERNAL=''',
  '''^libxcb-keysyms''',
  '''^b2_bucket_private$''',
]

[[allowlists]]
description = "Exact privacy-regression fixtures and disposable portal request handles"
regexTarget = "secret"
regexes = [
  '''^(Fk4Rw8Lq2Zn7Hc5T|Zq9xK2mLpW4vR7tY)$''',
  '''^wJalrXUtnFEMI/K7MDENG/bPxRfiCYVALIDATION1$''',
  '''^eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJzeW50aGV0aWMifQ\.c3ludGhldGljc2lnbmF0dXJl$''',
  '''^putgd_record_4242_[13]$''',
]

[[allowlists]]
description = "Grype database cache identities and the input-guard evidence's literal prose"
regexTarget = "secret"
regexes = [
  '''^grype-db-v6-[0-9a-f]{64}$''',
  '''^foreground/occlusion$''',
]

[[allowlists]]
description = "Exact synthetic AppImage TLS-check access key"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^records/2026-10-21-appimage-ca-bundle-329/lab/i329\.py$''']
regexTarget = "secret"
regexes = ['''^AKIAPUTGDI329SYNTHETIC$''']
