<!doctype html>
<html><head><meta charset="utf-8"><title>Review mock 4</title>
<style>
@font-face{font-family:Plex;src:url(fonts/IBMPlexSans-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSans-Medium.ttf);font-weight:500}
@font-face{font-family:Plex;src:url(fonts/IBMPlexSans-SemiBold.ttf);font-weight:600}
@font-face{font-family:PlexMono;src:url(fonts/IBMPlexMono-Regular.ttf)}
:root{--well:#121212;--bg:#191919;--surface:#202020;--raised:#2A2A2A;--selected:#333230;--border:rgba(255,255,255,.07);
--text:#F0F0EC;--text2:#C4C4BF;--muted:#AAAAA6;--disabled:#7B7B77;--accent:#E8B66D;--onAccent:#24201A;--link:#E8C591;--danger:#E59B93;--primary:#DEDED8;--warnSurface:#332C22}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;font-family:Plex;color:var(--text);font-size:13px;padding:56px 48px 64px 72px}
.stage{display:flex;gap:48px;align-items:flex-start}
.win{flex:none;position:relative}
.clip{position:absolute;inset:0;border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.09),0 30px 80px rgba(0,0,0,.6)}
.abs{position:absolute}.row{display:flex;align-items:center}.sp{flex:1}.muted{color:var(--muted)}
.title{left:0;top:0;right:0;height:40px;border-bottom:1px solid var(--border)}
.title .app{position:absolute;left:14px;top:10px;font-weight:600;font-size:14px}.title .app span{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:12px}
.wb{position:absolute;right:8px;top:6px;display:flex;gap:4px}.wb span{width:34px;height:28px;display:grid;place-items:center}
.tools{left:0;top:40px;right:0;height:52px;border-bottom:1px solid var(--border);padding:0 12px;gap:4px}
.tb{height:34px;min-width:34px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;border-radius:7px;color:var(--text);font-weight:500;white-space:nowrap}
.tb.on{background:var(--raised)}.tb.dis{color:var(--disabled)}
.focus{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.tsep{width:1px;height:24px;background:rgba(255,255,255,.1);margin:0 8px}
.viewer{left:0;top:92px;background:var(--well)}
.insp{top:92px;border-left:1px solid var(--border);background:var(--bg);padding:16px}
.insp h2,.ov h2{font-size:15px;font-weight:600;margin-bottom:6px}
.insp p,.ov p{color:var(--text2);font-size:12.5px;line-height:1.45;margin-bottom:12px}
.lbl{font-size:12px;margin:12px 0 6px;color:var(--muted)}
.lbl.link{color:var(--link);display:flex;align-items:center;gap:5px}
.field{display:flex;gap:6px;align-items:center}
.inp{height:30px;border-radius:6px;background:var(--surface);border:1px solid rgba(255,255,255,.1);font-family:PlexMono;font-size:12.5px;display:flex;align-items:center;padding:0 9px;width:84px}
.mini{height:30px;border-radius:6px;background:var(--raised);display:flex;align-items:center;gap:6px;padding:0 9px;font-size:12px;color:var(--text2);white-space:nowrap}
.seg{display:flex;background:var(--surface);border-radius:7px;padding:3px;gap:3px;border:1px solid rgba(255,255,255,.07)}
.seg div{flex:1;height:26px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text2);font-weight:500}.seg .on{background:var(--selected);color:var(--text)}
.btn{height:32px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;border-radius:7px;background:var(--raised);color:var(--text);font-weight:500;white-space:nowrap;border:1px solid rgba(255,255,255,.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.primary{background:var(--primary);color:#1b1b19;border-color:transparent;padding:0 16px}
.hr{height:1px;background:var(--border);margin:18px -16px 16px}
.list{margin:0 -8px}
.it{display:flex;align-items:center;gap:10px;height:40px;padding:0 8px;border-radius:7px;color:var(--text2)}
.it.sel{background:var(--selected);box-shadow:inset 2px 0 0 var(--accent)}
.it .nm{flex:1;font-weight:500;color:var(--text)}.it .tm{font-family:PlexMono;font-size:11.5px;color:var(--muted)}
.ico{width:26px;height:26px;border-radius:6px;background:var(--surface);display:grid;place-items:center;flex:none}
.tl{left:0;border-top:1px solid var(--border);background:var(--bg)}
.tlh{position:absolute;left:0;top:0;right:0;height:42px;padding:0 12px;gap:6px}
.time{font-family:PlexMono;font-size:13.5px}.time i{font-style:normal;color:var(--muted)}
.foot{left:0;right:0;height:56px;border-top:1px solid var(--border);padding:0 14px;gap:8px;background:var(--bg)}
.k{font-family:PlexMono;font-size:11px;color:var(--muted);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:0 5px;height:18px;display:inline-flex;align-items:center}
.how{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);color:var(--text2);font-size:12.5px}.how:last-child{border-bottom:0}
.how .g{width:64px;flex:none;display:flex;gap:4px;align-items:center}.how .k{color:var(--text)}
.split{display:flex}.split .tb:first-child{border-radius:7px 0 0 7px}.split .tb:last-child{border-radius:0 7px 7px 0;min-width:20px;padding:0 4px}
.ov{position:absolute;background:var(--surface);border:1px solid rgba(255,255,255,.1);border-radius:10px;box-shadow:0 18px 50px rgba(0,0,0,.55);padding:16px;z-index:4}
.notes{width:440px;padding-top:2px}
.notes h1{font-size:24px;font-weight:600;letter-spacing:-.2px}
.notes .sub{color:var(--muted);margin:8px 0 22px;font-size:14px;line-height:1.5}
.note{display:flex;gap:12px;margin-bottom:15px;line-height:1.45;font-size:14px;color:var(--text2)}.note b{color:var(--text);font-weight:600}
.n,.pin{flex:none;width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--onAccent);font-weight:600;font-size:12.5px;display:grid;place-items:center}
.pin{position:absolute;box-shadow:0 0 0 3px #0d0d0d;z-index:5}
.inset{margin-top:16px}.inset .cap{color:var(--muted);font-size:12.5px;margin-bottom:6px}
.strip{height:32px;border-radius:6px;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;font-size:12.5px;font-weight:500}
.card{background:var(--bg);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:14px 16px}
</style></head><body>
<div class="stage"><div class="win" id="win"><div class="clip" id="clip"></div><div id="pins"></div></div><div class="notes" id="notes"></div></div>
<script>
const ST=(location.hash||'#edit').slice(1);const OPEN=ST=='open',COMPACT=ST=='compact',LIGHT=ST=='light';
const DUR=32,TRIM=OPEN?[0,32]:[2.6,29.4],CUT=OPEN?null:[13.0,19.5],MASK=[8.2,12.6],BLUR=OPEN?null:[22.1,24.9],PLAY=OPEN?0:(COMPACT?19.5:10.4),SKIM=OPEN?5.3:null;
</script>

<script>

 blur:(c,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24"><path d="M12 3C9 7 5 10 5 15c0 8 14 8 14 0 0-5-4-8-7-12z" fill="none" stroke="${c}" stroke-width="1.7"/><path d="M8.6 15.5a3.5 3.5 0 0 0 3 3" fill="none" stroke="#777773" stroke-width="1.5"/></svg>`,
 undo:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 9h11q6 0 6 6t-6 6h-5M9 4L4 9l5 5" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 redo:c=>`<svg width="18" height="18" viewBox="0 0 24 24" style="transform:scaleX(-1)"><path d="M4 9h11q6 0 6 6t-6 6h-5M9 4L4 9l5 5" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,

 upload:c=>`<svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 15v4q0 2 2 2h14q2 0 2-2v-4M12 16V3M7 8l5-5 5 5" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
 save:'<svg width="16" height="16" viewBox="0 0 24 24"><path d="M3 7q0-2 2-2h4l2 2h8q2 0 2 2v9q0 2-2 2H5q-2 0-2-2z" fill="none" stroke="#D6D6D2" stroke-width="1.6"/><path d="M12 10v7M8 13l4 4 4-4" fill="none" stroke="#D6D6D2" stroke-width="1.6" stroke-linecap="round"/></svg>',
 // frame step: a film frame with a small arrow, distinct from skip-to-start
 stepB:'<svg width="18" height="18" viewBox="0 0 24 24"><rect x="10" y="5" width="11" height="14" rx="1.5" fill="none" stroke="#D6D6D2" stroke-width="1.6"/><path d="M10 9h-1M10 15h-1" stroke="#D6D6D2"/><path d="M7 8l-4 4 4 4" fill="none" stroke="#D6D6D2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 stepF:'<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="5" width="11" height="14" rx="1.5" fill="none" stroke="#D6D6D2" stroke-width="1.6"/><path d="M17 8l4 4-4 4" fill="none" stroke="#D6D6D2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 jump:'<svg width="11" height="11" viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="#E8C591" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 silent:'<svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="none" stroke="#AAAAA6" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 9l5 6M22 9l-5 6" stroke="#AAAAA6" stroke-width="1.7" stroke-linecap="round"/></svg>',
 zoom:'<svg width="16" height="16" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="#C4C4BF" stroke-width="1.7"/><path d="M15 15l5 5" stroke="#C4C4BF" stroke-width="1.7" stroke-linecap="round"/></svg>',
 panel:c=>`<svg width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="${c}" stroke-width="1.7"/><path d="M15 4v16" stroke="${c}" stroke-width="1.7"/></svg>`,
 pointer:'<svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-3 6z" fill="#F0F0EC" stroke="#F0F0EC" stroke-width="1.2" stroke-linejoin="round"/></svg>',
 play:'<svg width="16" height="16" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#F0F0EC"/></svg>',
};
const T='#D6D6D2',D='#7B7B77';
const editsList=(sel)=>`
  <h2 style="margin-bottom:8px">Edits</h2>
  <div class="list">
   <div class="it"><div class="ico">${I.trim}</div><div class="nm">Trim</div><div class="tm">0:02.6–0:29.4</div></div>
   <div class="it${sel=='mask'?' sel':''}"><div class="ico">${I.redact(15)}</div><div class="nm">Redaction 1</div>${sel=='mask'?'<div style="font-size:12px;color:var(--danger);font-weight:500">Remove</div>':'<div class="tm">0:08.2–0:12.6</div>'}</div>
   <div class="it${sel=='cut'?' sel':''}"><div class="ico">${I.cut('#C4C4BF',15)}</div><div class="nm">Cut</div><div class="tm">0:13.0–0:19.5</div></div>
   <div class="it"><div class="ico">${I.blur('#C4C4BF',15)}</div><div class="nm">Blur 1</div><div class="tm">0:22.1–0:24.9</div></div>
  </div>`;
const editPanel=`
  <h2>Redaction 1</h2>
  <p>Covered pixels are removed from the saved and uploaded clip.</p>
  <div class="lbl link">Shows from ${I.jump}</div>
  <div class="field"><div class="inp">0:08.2</div><div class="mini">Set to playhead</div></div>
  <div class="lbl link">Until ${I.jump}</div>
  <div class="field"><div class="inp">0:12.6</div><div class="mini">Set to playhead</div></div>
  <div class="lbl">Cover</div>
  <div class="seg"><div class="on">Redact</div><div>Blur</div></div>
  <div class="hr"></div>${editsList('mask')}`;
const how=(g,t)=>`<div class="how"><div class="g">${g}</div><div>${t}</div></div>`;
const openPanel=`
  <h2>No edits yet</h2>
  <p>Upload sends the whole clip.</p>
  ${how('<span class="k">⟦ ⟧</span>','Drag a bracket to trim the ends')}
  ${how(I.pointer+'<span class="muted" style="font-size:11.5px">drag</span>','Drag across the filmstrip to select time')}
  ${how('<span class="k">C</span><span class="k">Del</span>','Cut the selected time')}
  ${how('<span class="k">X</span><span class="k">B</span>','Redact or blur part of the picture for that time')}
  ${how('<span class="k">Ctrl+Z</span>','Undo any edit')}`;
const cutOverlay=`
  <h2>Cut</h2>
  <p><span style="font-family:PlexMono">0:13.0 – 0:19.5</span> · 6.5 s left out of the clip.</p>
  <div class="row" style="gap:8px"><div class="btn primary focus" style="padding:0 14px">Restore</div><div class="btn">${I.play}Play across</div></div>
  <div class="hr"></div>${editsList('cut')}`;
document.getElementById('win').style.cssText=`width:${WW}px;height:${WH}px`;
document.getElementById('clip').innerHTML=`
 <div class="abs title"><div class="app">Review recording<span>Not uploaded</span></div>
  <div class="wb"><span><svg width="12" height="12"><path d="M1 6h10" stroke="#D6D6D2" stroke-width="1.3"/></svg></span><span><svg width="12" height="12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="#D6D6D2" stroke-width="1.3"/></svg></span><span><svg width="12" height="12"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9" stroke="#D6D6D2" stroke-width="1.3"/></svg></span></div></div>
 <div class="abs row tools">
  <div class="tb on">${I.select(T)}</div><div class="tsep"></div>
  <div class="tb dis">${I.cut(D)}Cut</div>
  <div class="tb">${I.redact()}Redact</div>
  <div class="tb">${I.blur(T)}Blur</div><div class="tsep"></div>
  <div class="tb">${I.undo(OPEN?D:T)}</div><div class="tb">${I.redo(D)}</div>
  <div class="sp"></div>
  <div class="tb" style="color:var(--text2)">Fit · ${COMPACT?'29':'38'}% ${I.chev}</div>
  ${COMPACT?`<div class="tb on" style="box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)">${I.panel(T)}Edits</div>`:`<div class="tb on">${I.panel(T)}</div>`}
 </div>
 <div class="abs viewer" style="width:${VW}px;height:${VH}px"><canvas id="main"></canvas></div>
 ${PW?`<div class="abs insp" style="left:${VW}px;width:${PW}px;height:${WH-92-56}px">${OPEN?openPanel:editPanel}</div>`:''}
 ${COMPACT?`<div class="ov" style="right:12px;top:96px;width:300px">${cutOverlay}</div>`:''}
 <div class="abs tl" style="top:${92+VH}px;width:${VW}px;height:${42+TLH}px">
  <div class="row tlh">
   <div class="split"><div class="tb" style="background:var(--raised)">${I.play}</div><div class="tb" style="background:var(--raised);border-left:1px solid rgba(0,0,0,.35)">${I.chev}</div></div>
   <div class="tb" title="Previous frame (,)">${I.stepB}</div><div class="tb" title="Next frame (.)">${I.stepF}</div>
   <div class="time" style="margin-left:6px">${OPEN?'0:00.0 <i>/ 0:32.0</i>':COMPACT?'0:10.4 <i>/ 0:20.3</i>':'0:07.8 <i>/ 0:20.3</i>'}</div>
   <div class="muted" style="font-size:12px;margin-left:4px">clip time</div>
   <div class="sp"></div>
   <div class="row muted" style="font-size:12px;margin-right:10px;gap:6px">${I.silent}Preview is silent</div>
   <div class="tb" style="color:var(--text2)" title="Timeline zoom">${I.zoom}Fit</div>
  </div>
  <canvas id="strip" style="position:absolute;left:0;top:42px"></canvas>
 </div>
 <div class="abs row foot" style="top:${WH-56}px">
  <div class="btn ghost" style="padding:0 8px;color:var(--text)">MP4 <span class="muted">· with system audio</span> ${I.chev}</div>
  <div class="sp"></div>
  <div class="btn ghost">Discard…</div><div style="width:12px"></div>
  <div class="btn">${I.save}Save a copy…</div><div style="width:6px"></div>
  <div class="btn ghost" style="color:var(--text2);padding:0 6px 0 10px">Project archive · Shared link ${I.chev}</div>
  <div class="btn primary">${I.upload('#1b1b19')}Upload</div>
 </div>`;
// ---------- timeline painter, theme- and text-scale-aware ----------
const DARK={bg:'#191919',tick:'rgba(255,255,255,.35)',tick2:'rgba(255,255,255,.16)',label:'#AAAAA6',dim:'rgba(18,18,18,.74)',cutFill:'rgba(18,18,18,.84)',hatch:'rgba(255,255,255,.15)',cutEdge:'rgba(255,255,255,.5)',
 chip:'rgba(25,25,25,.9)',chipText:'#C4C4BF',tint:'rgba(232,182,109,.20)',accent:'#E8B66D',onAccent:'#24201A',bar2:'#5a5a57',bar2Text:'#E0E0DC',lane:'rgba(255,255,255,.045)',play:'#F0F0EC',playOutline:'rgba(0,0,0,.75)',flag:'#F0F0EC',flagText:'#191919',hint:'#8a8a86',sep:'rgba(0,0,0,.6)',placeholder:'#232323'};
const LIGHTP={bg:'#FFFFFF',tick:'rgba(0,0,0,.45)',tick2:'rgba(0,0,0,.2)',label:'#62625B',dim:'rgba(255,255,255,.72)',cutFill:'rgba(236,235,230,.9)',hatch:'rgba(41,41,38,.28)',cutEdge:'rgba(41,41,38,.55)',
 chip:'rgba(255,255,255,.95)',chipText:'#484844',tint:'rgba(143,91,32,.16)',accent:'#8F5B20',onAccent:'#FFFFFF',bar2:'#D6D5CF',bar2Text:'#292926',lane:'rgba(0,0,0,.045)',play:'#292926',playOutline:'#FFFFFF',flag:'#292926',flagText:'#FFFFFF',hint:'#62625B',sep:'rgba(0,0,0,.25)',placeholder:'#ECEBE6'};
function paintTimeline(cv,W,pal,fs){
 const SX=20,SW=W-40,X=t=>SX+t/DUR*SW;
 const RY=4,RH=Math.round(22*fs),FY=RY+RH+4,FH=72,LH=Math.round(13*fs),LY=FY+FH+10,H=LY+LH*2+10;
 cv.width=W*2;cv.height=H*2;cv.style.width=W+'px';cv.style.height=H+'px';const c=cv.getContext('2d');c.scale(2,2);c.fillStyle=pal.bg;c.fillRect(0,0,W,H);c.textBaseline='middle';
 const flagX=SKIM!=null?X(SKIM):null;c.font=`${11*fs}px PlexMono`;
 c.font=`${11*fs}px Plex`;const capW=c.measureText('recording time').width+8;c.textAlign='right';c.fillStyle=pal.label;c.fillText('recording time',SX+SW,RY+RH/2-3);c.textAlign='left';c.font=`${11*fs}px PlexMono`;
 for(let t=0;t<=DUR;t++){const x=X(t),maj=t%4==0;c.fillStyle=maj?pal.tick:pal.tick2;c.fillRect(Math.round(x),RY+RH-(maj?10:5),1,maj?10:5);
  const lw=c.measureText('0:00').width;
  if(maj&&t<DUR&&!(flagX!=null&&x+4<flagX+34*fs&&x+4+lw>flagX-34*fs)&&!(x+4+lw>SX+SW-capW)){c.fillStyle=pal.label;c.fillText(`0:${String(t).padStart(2,'0')}`,x+4,RY+RH/2-3)}}
 
 const N=Math.round(SW/(FH*16/9)),tw=SW/N,off=document.createElement('canvas');off.width=256;off.height=144;const oc=off.getContext('2d');const loaded=OPEN?N-3:N;
 c.save();c.beginPath();c.roundRect(SX,FY,SW,FH,6);c.clip();
 for(let i=0;i<N;i++){if(i>=loaded){c.fillStyle=pal.placeholder;c.fillRect(SX+i*tw,FY,tw,FH);continue}
