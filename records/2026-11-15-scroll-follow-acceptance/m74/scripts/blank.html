<!doctype html>
<html><head><meta charset="utf-8"><title>Blank stretch</title></head>
<body style="margin:0;background:#ffffff;color:#222;font:18px/1.6 sans-serif">
<div style="width:900px;margin:0 auto;padding:24px 0">
<script>
function para(n){return '<p><b>Paragraph '+n+'.</b> '+('The quick brown fox jumps over the lazy dog, line '+n+'. ').repeat(4)+'</p>';}
let h='<h1>Before the blank stretch</h1>';for(let i=1;i<=30;i++)h+=para(i);
h+='<p><b>Below this line: 2,600 px of nothing.</b></p><div style="height:2600px"></div>';
h+='<h1>After the blank stretch</h1>';for(let i=31;i<=60;i++)h+=para(i);
h+='<p><b>The end.</b></p>';document.write(h);
</script>
</div></body></html>
