<!doctype html><meta charset="utf-8"><title>Scroll probe ruler</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;scroll-behavior:auto} .row{height:40px;position:relative;display:flex} .cell{height:40px;flex:1} .number{position:absolute;left:10px;top:2px;background:#ffdb70;color:#000;font:16px monospace}</style><main id="rows"></main><script>for(let i=0;i<1000;i++){let r=document.createElement('div');r.className='row';for(let b=15;b>=0;b--){let c=document.createElement('div');c.className='cell';c.style.background=(i>>b)&1?'#fff':'#000';r.append(c)}let n=document.createElement('span');n.className='number';n.textContent=i;r.append(n);rows.append(r)}window.probeEvents=[];addEventListener('wheel',e=>{probeEvents.push({dy:e.deltaY,mode:e.deltaMode,y:scrollY});setTimeout(()=>document.title='Ruler dpr='+devicePixelRatio+' y='+scrollY+' delta='+e.deltaY+' mode='+e.deltaMode,400)},{passive:true});</script><script>let marker=document.createElement('div');marker.style='position:fixed;left:0;top:0;width:2px;height:2px';document.body.append(marker);let phase=0;setInterval(()=>marker.style.background=(phase++%2?'red':'blue'),200);</script>
